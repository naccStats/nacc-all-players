/* the four stat cards */
#stats .panel { --p-h: 336px; }

.nx-piece { position: absolute; inset: 48px 48px 0; width: auto; display: grid; gap: 4px; align-content: space-evenly; padding: 20px 28px; border: 0; border-radius: 12px 12px 0 0; background: #15120f; color: #d9d5cf; font: 400 14px/1.4 var(--font-text); box-shadow: none; }
.nx-bar { display: grid; grid-template-columns: 164px minmax(0, 1fr) 52px; gap: 14px; align-items: center; min-height: 28px; }
.nx-bar span { display: flex; align-items: center; gap: 10px; min-width: 0; color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; }
.nx-bar i { height: 10px; border-radius: 0 4px 4px 0; background: rgb(255 255 255 / .07); }

.nx-bar em, .nx-key em { text-align: right; font: 500 17px/1 var(--font-display); color: #fff; font-variant-numeric: lining-nums tabular-nums; }
.nx-stack { display: flex; gap: 2px; min-height: 28px; margin-bottom: 12px; }

.nx-key { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 28px; }

.nx-piece:has(.nx-hist) { grid-template-rows: minmax(0, 1fr) auto; align-content: stretch; gap: 12px; padding-block: 28px; }
.nx-piece:has(.nx-stack) { grid-template-rows: minmax(0, 1fr); grid-auto-rows: 40px; align-content: stretch; padding-block: 28px; }

@media (max-width: 639px) {
